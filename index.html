<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Khế Ước Đồng Hành — Bin & Bean</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --rose-50: #fff1f5;
      --rose-100: #ffe4ec;
      --rose-200: #fccedb;
      --rose-400: #f4729f;
      --rose-600: #db2764;
      --rose-700: #be185d;
      --gold-dark: #a17838;
      --gold-light: #f1cf88;
      --ink-navy: #1f2430;
      --text-muted: #5d6474;
      --card-bg: rgba(255, 255, 255, 0.94);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 15% 15%, #ffe6ef 0%, #ffd0e0 45%, #ffb8cf 100%);
      color: var(--ink-navy);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 12px;
      position: relative;
      overflow-x: hidden;
    }

    /* Hoa văn nền nhẹ nhàng */
    .bg-shape {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
    }
    .shape-1 { width: 350px; height: 350px; background: rgba(255, 182, 193, 0.6); top: -60px; left: -60px; }
    .shape-2 { width: 450px; height: 450px; background: rgba(254, 205, 211, 0.5); bottom: -100px; right: -80px; }

    /* Khung hợp đồng chính */
    .contract-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 780px;
      background: var(--card-bg);
      border-radius: 28px;
      box-shadow: 0 24px 60px rgba(190, 24, 93, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.8) inset;
      border: 2px solid #ffd4e2;
      padding: 44px 48px;
      backdrop-filter: blur(14px);
    }

    /* Viền họa tiết hoàng gia góc */
    .corner-decor {
      position: absolute;
      width: 28px;
      height: 28px;
      border: 2px solid var(--rose-400);
      pointer-events: none;
    }
    .top-l { top: 14px; left: 14px; border-right: none; border-bottom: none; }
    .top-r { top: 14px; right: 14px; border-left: none; border-bottom: none; }
    .bot-l { bottom: 14px; left: 14px; border-right: none; border-top: none; }
    .bot-r { bottom: 14px; right: 14px; border-left: none; border-top: none; }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header .sub-badge {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--rose-700);
      background: #ffe3ec;
      padding: 6px 16px;
      border-radius: 30px;
      margin-bottom: 12px;
      border: 1px solid #ffccd9;
    }
    .header h1 {
      font-family: 'Cinzel', serif;
      font-size: 28px;
      letter-spacing: 1px;
      color: var(--ink-navy);
      margin-bottom: 6px;
    }
    .header p {
      font-size: 13.5px;
      color: var(--text-muted);
      font-style: italic;
    }

    /* Progress bar */
    .step-indicator {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 18px 0 28px;
    }
    .dot {
      width: 28px;
      height: 4px;
      border-radius: 4px;
      background: #fcd0dc;
      transition: all 0.3s ease;
    }
    .dot.active {
      width: 44px;
      background: var(--rose-600);
    }

    /* Sections / Steps */
    .step-content {
      display: none;
      min-height: 380px;
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .step-content.active {
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Bước 1: Giới thiệu hai nhân vật (Both Boys) */
    .party-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 20px;
      margin-top: 20px;
    }
    .profile-card {
      background: #fff8fa;
      border: 1.5px solid #fecdd6;
      border-radius: 18px;
      padding: 24px 18px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(219, 39, 100, 0.05);
    }
    .avatar-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #ffdbe6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 12px;
      border: 2px solid #ff9cb7;
    }
    .profile-card h3 {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      color: var(--rose-700);
      margin-bottom: 4px;
    }
    .profile-card .tag {
      font-size: 11.5px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .profile-card p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 10px;
      line-height: 1.5;
    }
    .ampersand {
      font-family: 'Cinzel', serif;
      font-size: 34px;
      color: var(--gold-dark);
      font-weight: bold;
    }

    /* Bước 2: Sính Lễ & Lễ Vật */
    .tribute-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 10px;
    }
    .tribute-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: #ffffff;
      border: 1.5px solid #f9ced8;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.25s ease;
      user-select: none;
    }
    .tribute-item:hover {
      border-color: var(--rose-400);
      background: #fff8fa;
      transform: translateY(-2px);
    }
    .tribute-item.selected {
      border-color: var(--rose-600);
      background: #ffe9f0;
      box-shadow: 0 4px 12px rgba(219, 39, 100, 0.15);
    }
    .tribute-img {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid #ffd4e0;
    }
    .tribute-info h4 {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink-navy);
    }
    .tribute-info span {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Bước 3: Điều khoản */
    .covenant-box {
      background: #fffafb;
      border: 1px solid #fcd4de;
      border-radius: 16px;
      padding: 22px;
    }
    .covenant-item {
      display: flex;
      gap: 14px;
      margin-bottom: 16px;
      line-height: 1.6;
      font-size: 13.5px;
    }
    .covenant-item:last-child {
      margin-bottom: 0;
    }
    .cov-num {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      color: var(--rose-600);
      background: #ffe3ec;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 12px;
    }

    /* Bước 4: Nhập email */
    .form-group {
      margin: 22px 0;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--ink-navy);
    }
    .input-field {
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1.5px solid #fecdd6;
      background: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.25s;
    }
    .input-field:focus {
      border-color: var(--rose-600);
      box-shadow: 0 0 0 3px rgba(219, 39, 100, 0.15);
    }

    /* Bước 5: Ấn chứng & Xác nhận */
    .seal-stage {
      text-align: center;
      padding: 20px 0;
    }
    .wax-seal {
      width: 86px;
      height: 86px;
      margin: 0 auto 16px;
      background: radial-gradient(circle, #db2764 0%, #9d174d 100%);
      border-radius: 50
