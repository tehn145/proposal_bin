<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bin 💖 Bean</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--sky:#bfe9ff;--pink:#ffc2e2;--lilac:#d9c7ff;--sun:#ffe58a;--ink:#3b1f5c;--hot:#ff4fa3;--card:#ffffffd9}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Quicksand',sans-serif;color:var(--ink);background:linear-gradient(120deg,var(--sky),var(--pink),var(--lilac),var(--sun));background-size:300% 300%;animation:bg 14s ease infinite;-webkit-tap-highlight-color:transparent}
@keyframes bg{50%{background-position:100% 50%}}
h1,h2{font-family:'Baloo 2',cursive;line-height:1.05}
h1{font-size:clamp(2.6rem,9vw,5rem)}h2{font-size:clamp(1.8rem,6vw,3rem)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
#fx span{position:absolute;bottom:-60px;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-115vh) rotate(40deg);opacity:0}}
.spark{position:fixed;pointer-events:none;z-index:50;animation:pop .8s forwards}
@keyframes pop{to{transform:translateY(-30px) scale(0);opacity:0}}
#deck{position:fixed;inset:0;z-index:2}
.page{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:max(24px,env(safe-area-inset-top)) 64px max(70px,env(safe-area-inset-bottom));text-align:center;transition:transform .6s cubic-bezier(.7,0,.2,1),opacity .6s;opacity:0;transform:translateX(100%);overflow-y:auto}
.page.on{opacity:1;transform:none}.page.prev{transform:translateX(-100%)}
.nav{position:fixed;top:50%;z-index:20;width:52px;height:52px;margin-top:-26px;border:0;border-radius:50%;background:#fff;color:var(--hot);font:800 26px 'Baloo 2';cursor:pointer;box-shadow:0 6px 20px #ff4fa355;transition:.2s}
.nav:hover{transform:scale(1.15) rotate(8deg)}.nav:disabled{opacity:.25;pointer-events:none}
#L{left:max(8px,env(safe-area-inset-left))}#R{right:max(8px,env(safe-area-inset-right))}
#dots{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;z-index:20;display:flex;justify-content:center;gap:10px}
#dots i{width:12px;height:12px;border-radius:50%;background:#fff9;transition:.3s;cursor:pointer}
#dots i.on{background:var(--hot);width:34px;border-radius:8px}
.sticker{font-size:clamp(3rem,12vw,6rem);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-14px) rotate(6deg)}}
.avatars{display:flex;align-items:center;gap:clamp(8px,4vw,32px)}
.av{width:clamp(110px,28vw,170px);height:clamp(110px,28vw,170px);border-radius:50%;background:#fff;display:grid;place-items:center;font-size:clamp(3.5rem,13vw,6rem);box-shadow:0 0 0 8px var(--c),0 14px 30px #0002;position:relative;animation:bob 3s ease-in-out infinite}
.av b{position:absolute;bottom:-14px;background:var(--c);color:#fff;font:800 1.1rem 'Baloo 2';padding:2px 16px;border-radius:20px}
.av.b2{animation-delay:-1.5s}
.beat{font-size:clamp(2.4rem,9vw,4rem);animation:beat 1s infinite}
@keyframes beat{15%{transform:scale(1.35)}30%{transform:scale(1)}45%{transform:scale(1.25)}}
.rainbow{background:linear-gradient(90deg,#ff4fa3,#8a5cff,#27a9ff,#ff4fa3);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 4s linear infinite}
@keyframes flow{to{background-position:200%}}
.marq{width:min(92vw,720px);overflow:hidden;border-radius:30px;background:var(--card);padding:10px 0}
.marq div{display:inline-block;white-space:nowrap;animation:mq 22s linear infinite;font-weight:700}
.marq span{margin:0 18px}
@keyframes mq{to{transform:translateX(-50%)}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:12px;width:min(94vw,640px)}
.opt{background:var(--card);border:3px solid transparent;border-radius:24px;padding:14px 6px;cursor:pointer;font:700 .95rem 'Quicksand';color:var(--ink);transition:.25s;position:relative}
.opt em{display:block;font-style:normal;font-size:2.8rem;transition:.3s}
.opt:hover em{transform:scale(1.2) rotate(-8deg)}
.opt.sel{border-color:var(--hot);background:#fff;transform:translateY(-6px);box-shadow:0 10px 22px #ff4fa355}
.opt.sel::after{content:'💖';position:absolute;top:-10px;right:-6px;font-size:1.4rem;animation:beat 1s infinite}
.tag{background:#fff;border-radius:30px;padding:6px 18px;font-weight:700}
.flip{perspective:700px;width:150px;height:170px;cursor:pointer}
.flip>div{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.flip.f>div{transform:rotateY(180deg)}
.flip p{position:absolute;inset:0;border-radius:26px;display:grid;place-items:center;backface-visibility:hidden;background:#fff;box-shadow:0 10px 24px #0002;padding:10px;font-weight:700}
.flip p:first-child{font-size:4rem}.flip p+p{transform:rotateY(180deg);background:var(--hot);color:#fff;font-size:1.05rem}
.row{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.path{display:flex;flex-direction:column;gap:14px;width:min(92vw,420px);position:relative}
.stop{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:60px;padding:10px 22px 10px 10px;cursor:pointer;font-weight:700;text-align:left;transition:.3s}
.stop:nth-child(even){flex-direction:row-reverse;text-align:right;padding:10px 10px 10px 22px}
.stop i{font-style:normal;font-size:2.4rem;width:64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 12px #0002}
.stop:hover{transform:scale(1.05)}
.stop.pop i{animation:beat .8s}
.btn{border:0;border-radius:40px;background:linear-gradient(90deg,#ff4fa3,#8a5cff);color:#fff;font:800 1.3rem 'Baloo 2';padding:12px 34px;cursor:pointer;box-shadow:0 10px 24px #ff4fa366;transition:.2s}
.btn:hover{transform:scale(1.07)}.btn:disabled{opacity:.6}
.inp{width:min(88vw,380px);border:3px solid #fff;border-radius:40px;padding:14px 22px;font:700 1.1rem 'Quicksand';color:var(--ink);text-align:center;outline:0;background:#fffc;transition:.2s}
.inp:focus{border-color:var(--hot);background:#fff}
.err{color:#d6004f;font-weight:700;min-height:1.4em}
.sum{background:var(--card);border-radius:28px;padding:16px 22px;max-width:min(92vw,440px);font-size:1.8rem;line-height:1.5}
.ok{font-size:7rem;animation:bob 1.6s infinite}
a.nav-link{color:var(--hot);font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="fx"></div>
<div id="deck">

<section class="page">
  <div class="avatars">
    <div class="av" style="--c:#27a9ff">👨🏻<b>Bin</b></div>
    <div class="beat">💞</div>
    <div class="av b2" style="--c:#ff4fa3">👨🏽<b>Bean</b></div>
  </div>
  <h1 class="rainbow">Bin &amp; Bean</h1>
  <div class="sticker" style="font-size:2.6rem">🌈 👬 🫶 🏳️‍🌈 ✨</div>
  <div class="marq"><div id="mq"></div></div>
</section>

<section class="page">
  <h2>Chọn sính lễ 🎁</h2>
  <div class="tag">Chạm để bỏ vào mâm · <span id="cnt">0</span> món</div>
  <div class="grid" id="gifts"></div>
</section>

<section class="page">
  <h2>Vài điều nhỏ 🤫</h2>
  <div class="tag">Lật thẻ ra xem</div>
  <div class="row" id="flips"></div>
</section>

<section class="page">
  <h2>Hành trình của tụi mình 🗺️</h2>
  <div class="path" id="path"></div>
</section>

<section class="page">
  <h2>Mai này tụi mình… 🔮</h2>
  <div class="tag">Chọn những điều muốn có</div>
  <div class="grid" id="wishes"></div>
  <div class="sticker" id="future" style="font-size:2.6rem;min-height:3.4rem"></div>
</section>

<section class="page">
  <div class="sticker">💌</div>
  <h2>Gửi thiệp cho ai nè?</h2>
  <input class="inp" id="mail" type="email" placeholder="email@cua-ban.com" autocomplete="email">
  <div class="err" id="err"></div>
  <button class="btn" id="next6">Tiếp nào 💘</button>
</section>

<section class="page">
  <div id="p7a">
    <div class="sticker" style="margin-bottom:10px">🔐</div>
    <h2>Chốt đơn thương nhau?</h2>
    <div class="sum" id="sum" style="margin:14px auto"></div>
    <div class="tag" id="to" style="display:inline-block;margin-bottom:14px"></div><br>
    <button class="btn" id="send">Xác nhận &amp; gửi mail 💖</button>
    <div class="err" id="serr" style="margin-top:8px"></div>
  </div>
  <div id="p7b" style="display:none">
    <div class="ok">🥳</div>
    <h2 class="rainbow">Đã chốt!</h2>
    <p class="tag" style="display:inline-block;margin-top:12px" id="done"></p>
  </div>
</section>

</div>

<button class="nav" id="L" aria-label="Trang trước">&lt;</button>
<button class="nav" id="R" aria-label="Trang sau">&gt;</button>
<div id="dots"></div>

<script>
/* ===== CẤU HÌNH GỬI MAIL THẬT (EmailJS) =====
   Tạo tài khoản emailjs.com → điền 3 giá trị dưới đây.
   Template cần dùng biến: {{to_email}}, {{gifts}}, {{wishes}}.
   Để trống = sẽ mở app mail có sẵn nội dung (mailto). */
const EMAILJS={service_id:'',template_id:'',user_id:''};

const $=s=>document.querySelector(s);
const st={gifts:new Set(),wishes:new Set(),email:''};
const phrases=['Gét gô về chung nhà 🏠','Chốt đơn thương nhau 📦💖','Cưng xỉu up xỉu down 🥹','Thương hết nước chấm 🫶','Không phải crush, là chốt luôn 😎','Say yes nha 💍','Hết nước chấm luôn á 🔥','Hai đứa mình là best couple 🏆'];
$('#mq').innerHTML=[...phrases,...phrases].map(p=>`<span>${p}</span>`).join('');

const gifts=[['🍵','Trà'],['🍰','Bánh'],['🍎','Trái cây'],['🥂','Rượu vang'],['🕯️','Nến thơm'],['💍','Nhẫn'],['🧋','Trà sữa'],['🌹','Hoa hồng'],['🍫','Socola'],['🧸','Gấu bông'],['🏮','Đèn lồng'],['🐶','Boss chó']];
const wishes=[['🏡','Nhà nhỏ'],['🐱','Boss mèo'],['🌴','Đi biển'],['🍳','Bếp chung'],['🎮','Game đôi'],['✈️','Du lịch'],['🌻','Vườn hoa'],['🚲','Đạp xe']];
const flips=[['🍜','Nấu cơm cho nhau'],['🛏️','Nhường nhau chăn'],['📱','Nhắn tin liền tay'],['🎶','Hát chung mỗi tối']];
const stops=[['☕','Gặp nhau lần đầu'],['🎬','Hẹn hò đầu tiên'],['🌅','Nói thương nhau'],['💍','Về chung nhà']];

function build(el,list,set,cb){
  $(el).innerHTML=list.map(([e,t])=>`<button class="opt" data-k="${t}"><em>${e}</em>${t}</button>`).join('');
  $(el).onclick=ev=>{const b=ev.target.closest('.opt');if(!b)return;const k=b.dataset.k;
    set.has(k)?set.delete(k):set.add(k);b.classList.toggle('sel',set.has(k));burst(ev.clientX,ev.clientY,['💖','✨','🌸']);cb()};
}
build('#gifts',gifts,st.gifts,()=>$('#cnt').textContent=st.gifts.size);
build('#wishes',wishes,st.wishes,()=>{$('#future').textContent=[...st.wishes].map(k=>wishes.find(w=>w[1]===k)[0]).join(' ')});
$('#flips').innerHTML=flips.map(([e,t])=>`<div class="flip"><div><p>${e}</p><p>${t}</p></div></div>`).join('');
$('#flips').onclick=ev=>{const f=ev.target.closest('.flip');if(f){f.classList.toggle('f');burst(ev.clientX,ev.clientY,['💘','🌟'])}};
$('#path').innerHTML=stops.map(([e,t])=>`<div class="stop"><i>${e}</i>${t}</div>`).join('');
$('#path').onclick=ev=>{const s=ev.target.closest('.stop');if(s){s.classList.remove('pop');void s.offsetWidth;s.classList.add('pop');burst(ev.clientX,ev.clientY,['💕','✨'])}};

/* ===== Điều hướng ===== */
const pages=[...document.querySelectorAll('.page')];let cur=0;
$('#dots').innerHTML=pages.map((_,i)=>`<i data-i="${i}"></i>`).join('');
function go(n){
  if(n<0||n>=pages.length)return;cur=n;
  pages.forEach((p,i)=>{p.classList.toggle('on',i===n);p.classList.toggle('prev',i<n)});
  [...$('#dots').children].forEach((d,i)=>d.classList.toggle('on',i===n));
  $('#L').disabled=n===0;$('#R').disabled=n===pages.length-1;
  if(n===6)prep7();
  if(n===0||n===3)burst(innerWidth/2,innerHeight/2,['💖','🌈','✨'],14);
}
$('#L').onclick=()=>go(cur-1);$('#R').onclick=()=>go(cur+1);
$('#dots').onclick=e=>{if(e.target.dataset.i)go(+e.target.dataset.i)};
addEventListener('keydown',e=>{if(/INPUT/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
let x0=null;
addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>70)go(cur+(d<0?1:-1));x0=null},{passive:true});

/* ===== Hiệu ứng ===== */
const fx=$('#fx'),hearts=['💖','💗','💕','🌸','✨','🫧','💞','🌈'];
setInterval(()=>{const s=document.createElement('span');s.textContent=hearts[Math.random()*hearts.length|0];
  s.style.cssText=`left:${Math.random()*100}%;font-size:${14+Math.random()*26}px;animation-duration:${7+Math.random()*7}s;opacity:.8`;
  fx.appendChild(s);setTimeout(()=>s.remove(),14500)},450);
function burst(x,y,set,n=9){for(let i=0;i<n;i++){const s=document.createElement('span');s.className='spark';
  s.textContent=set[Math.random()*set.length|0];
  s.style.cssText=`left:${x+(Math.random()-.5)*130}px;top:${y+(Math.random()-.5)*90}px;font-size:${18+Math.random()*18}px`;
  document.body.appendChild(s);setTimeout(()=>s.remove(),800)}}
addEventListener('pointermove',e=>{if(Math.random()<.12)burst(e.clientX,e.clientY,['✨','💖'],1)});
function confetti(){let t=0;const id=setInterval(()=>{burst(Math.random()*innerWidth,Math.random()*innerHeight*.7,['🎉','💖','🌈','🌸','✨','💍'],6);if(++t>18)clearInterval(id)},140)}

/* ===== Mail ===== */
const re=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
$('#next6').onclick=()=>{const v=$('#mail').value.trim();
  if(!re.test(v)){$('#err').textContent='Email chưa đúng, nhập lại nha 🥺';return}
  $('#err').textContent='';st.email=v;go(6)};
$('#mail').onkeydown=e=>{if(e.key==='Enter')$('#next6').click()};
const emo=(set,list)=>[...set].map(k=>list.find(x=>x[1]===k)[0]).join(' ')||'🤍';
function prep7(){
  $('#sum').innerHTML=`Sính lễ: ${emo(st.gifts,gifts)}<br>Tương lai: ${emo(st.wishes,wishes)}`;
  $('#to').textContent='Gửi xác nhận tới: '+st.email;
}
$('#send').onclick=async()=>{
  const b=$('#send');b.disabled=true;$('#serr').textContent='';
  const g=[...st.gifts].join(', ')||'(chưa chọn)',w=[...st.wishes].join(', ')||'(chưa chọn)';
  try{
    if(EMAILJS.service_id){
      const r=await fetch('https://api.emailjs.com/api/v1.0/email/send',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({...EMAILJS,template_params:{to_email:st.email,gifts:g,wishes:w}})});
      if(!r.ok)throw 0;
    }else{
      const body=`Bin & Bean xác nhận! 💖\n\nSính lễ: ${g}\nTương lai: ${w}\n\nGét gô về chung nhà!`;
      location.href=`mailto:${encodeURIComponent(st.email)}?subject=${encodeURIComponent('Bin & Bean – Xác nhận 💍')}&body=${encodeURIComponent(body)}`;
    }
    $('#p7a').style.display='none';$('#p7b').style.display='block';
    $('#done').textContent='Mail xác nhận → '+st.email;confetti();
  }catch(e){$('#serr').textContent='Gửi chưa được, thử lại nha 🥲';b.disabled=false}
};
go(0);
</script>
</body>
</html>
